<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>知らない広告</title>
<style>body{margin:0;font-family:sans-serif}article{padding:16px}</style></head><body>
<article><h1>記事</h1><p id="t"></p>
<iframe id="yt" src="https://www.youtube.com/embed/xyz" width="300" height="170"></iframe></article>
<script>
 document.getElementById('t').textContent='本文。'.repeat(500);
 // 知らない広告会社の、下に張り付く iframe 広告
 setTimeout(()=>{const d=document.createElement('div');d.id='unknown-anchor';
  d.style.cssText='position:fixed;bottom:0;left:0;right:0;height:70px;z-index:50';
  d.innerHTML='<iframe src="https://cdn.unknown-adnet.example/serve?slot=1" width="320" height="50"></iframe>';document.body.appendChild(d);},200);
 // absolute + 最前面 + 半透明で画面を覆うポップアップ
 setTimeout(()=>{const d=document.createElement('div');d.id='abs-overlay';
  d.style.cssText='position:absolute;top:0;left:0;width:100%;height:3000px;background:rgba(0,0,0,.5);z-index:99999';
  d.innerHTML='<div style="margin:100px auto;width:80%;background:#fff;padding:20px">アプリをダウンロード！<span class="close-btn">×</span></div>';document.body.appendChild(d);},400);
 // 判定をすり抜ける不透明なポップアップ（文字多め・×なし・背景なし・スクロールも止めない）
 function sneaky(){ if(document.getElementById('sneaky'))return; const d=document.createElement('div');d.id='sneaky';d.className='promo-sheet';
  d.style.cssText='position:fixed;left:5%;top:20%;width:90%;height:55%;background:#fff;border:2px solid #333;z-index:500;overflow:auto';
  d.innerHTML='<p>'+'会員登録すると特典があります。'.repeat(30)+'</p><a href="/signup">登録する</a>';document.body.appendChild(d);}
 setTimeout(sneaky,600); setInterval(sneaky,800);
</script></body></html>
